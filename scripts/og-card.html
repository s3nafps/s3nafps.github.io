<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OG card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600;650;700&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #07080c; }
  body { position: relative; color: #eef0f6; font-family: Inter, sans-serif; padding: 64px 72px; }
  .blob { position: absolute; border-radius: 50%; filter: blur(80px); }
  .b1 { width: 620px; height: 620px; right: -120px; top: -220px; background: radial-gradient(circle, rgba(139,92,246,.55), transparent 65%); }
  .b2 { width: 520px; height: 520px; right: 120px; bottom: -300px; background: radial-gradient(circle, rgba(34,211,238,.35), transparent 65%); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 56px 56px; -webkit-mask-image: radial-gradient(ellipse 70% 80% at 70% 30%, #000 20%, transparent 75%); }
  .content { position: relative; height: 100%; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; gap: 16px; }
  .mark { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(115deg, #8b5cf6, #6366f1 50%, #06b6d4); font: 600 20px 'JetBrains Mono', monospace; color: #fff; }
  .name { font: 650 26px/1.1 'Inter Tight', sans-serif; letter-spacing: -.02em; }
  .role { margin-top: 4px; color: #8b94a6; font: 500 14px 'JetBrains Mono', monospace; letter-spacing: .1em; text-transform: uppercase; }
  h1 { margin-top: 64px; font: 650 76px/1 'Inter Tight', sans-serif; letter-spacing: -.05em; max-width: 980px; }
  .serif { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; letter-spacing: -.01em; font-size: 1.08em; }
  .grad { background: linear-gradient(115deg, #c4b5fd, #a78bfa 30%, #818cf8 55%, #22d3ee); -webkit-background-clip: text; color: transparent; }
  .bottom { margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
  .chips { display: flex; gap: 10px; }
  .chip { padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); background: rgba(21,25,37,.7); color: #c6ccd8; font: 500 15px 'JetBrains Mono', monospace; }
  .url { color: #8b94a6; font: 500 17px 'JetBrains Mono', monospace; }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="grid"></div>
  <div class="content">
    <div class="top">
      <div class="mark">MS</div>
      <div><div class="name">Mohamed Senator</div><div class="role">Systems Administrator · Algiers</div></div>
    </div>
    <h1>I keep systems <span class="serif">running</span><br />and build the tools<br /><span class="grad">around them.</span></h1>
    <div class="bottom">
      <div class="chips"><span class="chip">PowerShell</span><span class="chip">Google Cloud</span><span class="chip">13 Apify Actors</span><span class="chip">Trackr · Android</span></div>
      <div class="url">s3nafps.github.io</div>
    </div>
  </div>
</body>
</html>
